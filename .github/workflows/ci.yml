
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Unit and integration tests
        run: mvn -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/

      - name: Build Docker image
        run: docker build -t taskapi:${{ github.sha }} .

  deploy:
    name: Deploy to AWS
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ap-southeast-2
      ECR_REPOSITORY: taskapi
      EC2_INSTANCE_ID: i-0e721dbe5855f7b83
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::373220261277:role/GitHubActionsTaskApiDeployRole
          aws-region: ap-southeast-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: 373220261277.dkr.ecr.ap-southeast-2.amazonaws.com
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Deploy image to EC2 through SSM
        run: |
          PARAMETERS=$(jq -n --arg tag "$IMAGE_TAG" '{
            commands: [
              "set -e",
              "aws ecr get-login-password --region ap-southeast-2 | sudo docker login --username AWS --password-stdin 373220261277.dkr.ecr.ap-southeast-2.amazonaws.com",
              ("sudo env IMAGE_TAG=" + $tag + " docker compose --env-file /etc/taskapi/docker.env -f /home/ec2-user/compose.ec2.yml pull app"),
              ("sudo env IMAGE_TAG=" + $tag + " docker compose --env-file /etc/taskapi/docker.env -f /home/ec2-user/compose.ec2.yml up -d --no-deps app"),
              "for i in $(seq 1 24); do if curl -fsS http://localhost:8080/actuator/health >/dev/null; then echo 'Health check passed'; exit 0; fi; sleep 5; done",
              "echo Health check failed",
              "sudo docker logs --tail 100 ec2-user-app-1",
              "exit 1"
            ]
          }')

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --comment "Deploy Task API $IMAGE_TAG" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          set +e
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"
          WAIT_STATUS=$?
          set -e

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json

          if [ "$WAIT_STATUS" -ne 0 ]; then
            exit 1
          fi
